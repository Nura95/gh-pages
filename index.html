<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Меню</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f2f2f2;
    }
    .frame {
      width: 100%;

      margin: 0 auto;
      border: 6px solid #cfa874;

      height: 100vh;
      border: none;
      display: block;
    }

<body>
  <div class="frame">
    <iframe 
      src="https://docs.google.com/viewer?url=https://nura95.github.io/gh-pages/menustaffbar.pdf&embedded=true"
