<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Меню</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
    }
    .frame {
      width: 100%;
      max-width: 800px;
      border: 6px solid #cfa874;
      background: #f6ecd8;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    #pdf-container {
      width: 100%;
    }
    #pdf-container canvas {
      width: 100%;
      height: auto;
      display: block;
    }
    #loading {
      text-align: center;
      padding: 60px 20px;
      font-family: Arial, sans-serif;
      color: #8b5a2b;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div id="loading">Загрузка меню…</div>
    <div id="pdf-container"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Загружаем PDF как бинарные данные через fetch,
    // а не по прямой ссылке — браузер не покажет кнопку "открыть/скачать"
    fetch('menustaffbar.pdf')
      .then(function(response) {
        return response.arrayBuffer();
      })
      .then(function(data) {
        return pdfjsLib.getDocument({ data: data }).promise;
      })
      .then(function(pdf) {
        document.getElementById('loading').style.display = 'none';
        const container = document.getElementById('pdf-container');
        const totalPages = pdf.numPages;
        let pagesRendered = 0;

        for (let i = 1; i <= totalPages; i++) {
          pdf.getPage(i).then(function(page) {
            const viewport = page.getViewport({ scale: 2 });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            container.appendChild(canvas);
            page.render({
              canvasContext: canvas.getContext('2d'),
              viewport: viewport
            });
          });
        }
      })
      .catch(function(error) {
        document.getElementById('loading').innerHTML = 
          'Не удалось загрузить меню. Обновите страницу.';
      });
  </script>
</body>
</html>
