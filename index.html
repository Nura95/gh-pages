<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Меню</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .frame {
      width: 90%;
      max-width: 800px;
      border: 6px solid #cfa874;
      background: #f6ecd8;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 85vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame">
    <iframe src="MENUSTAFFBAR.pdf" allowfullscreen></iframe>
  </div>
</body>
</html>
